name: Publish to PyPI

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false
  # GitHub supports this queue; actionlint 1.7.12 has not yet added its schema entry.
  queue: max

jobs:
  tag:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    name: Create release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate tested main commit
        id: candidate
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          echo 'eligible=true' >> "$GITHUB_OUTPUT"

      - name: Select release tag baseline
        if: ${{ steps.candidate.outputs.eligible == 'true' }}
        id: tags
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t current_tags < <(
            git tag --points-at HEAD --list 'v*' --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          )
          test "${#current_tags[@]}" -le 1
          existing_tag="${current_tags[0]:-}"
          latest_tag="$(
            git tag --list 'v*' --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1
          )"
          test -n "$latest_tag"
          latest_commit="$(git rev-parse "$latest_tag^{commit}")"

          if test "$latest_commit" != "$RELEASE_COMMIT" && \
            git merge-base --is-ancestor "$RELEASE_COMMIT" "$latest_commit"; then
            echo 'releasable=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Commit is already included in a newer release tag.'
            exit 0
          fi

          if test -n "$existing_tag"; then
            previous_tag=''
            while IFS= read -r tag; do
              tag_commit="$(git rev-parse "$tag^{commit}")"
              if test "$tag_commit" != "$RELEASE_COMMIT" && \
                git merge-base --is-ancestor "$tag_commit" "$RELEASE_COMMIT"; then
                previous_tag="$tag"
                break
              fi
            done < <(
              git tag --list 'v*' --sort=-v:refname |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'
            )
          else
            git merge-base --is-ancestor "$latest_commit" "$RELEASE_COMMIT"
            previous_tag="$latest_tag"
          fi
          test -n "$previous_tag"

          echo 'releasable=true' >> "$GITHUB_OUTPUT"
          printf 'existing_tag=%s\n' "$existing_tag" >> "$GITHUB_OUTPUT"
          printf 'previous_tag=%s\n' "$previous_tag" >> "$GITHUB_OUTPUT"
          printf 'previous_version=%s\n' "${previous_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Validate merged PR titles
        if: ${{ steps.tags.outputs.releasable == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ steps.tags.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t commits < <(git rev-list --reverse "$PREVIOUS_TAG^{commit}..HEAD")
          test "${#commits[@]}" -gt 0
          test "${#commits[@]}" -le 100
          for commit in "${commits[@]}"; do
            payload="$RUNNER_TEMP/associated-prs-$commit.json"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" > "$payload"
            COMMIT_SHA="$commit" \
            COMMIT_TITLE="$(git show -s --format=%s "$commit")" \
            PAYLOAD_PATH="$payload" \
              python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          commit = os.environ["COMMIT_SHA"]
          title = os.environ["COMMIT_TITLE"]
          pull_requests = json.loads(Path(os.environ["PAYLOAD_PATH"]).read_text())
          matches = [
              pull_request
              for pull_request in pull_requests
              if pull_request.get("merged_at")
              and pull_request.get("merge_commit_sha") == commit
              and pull_request.get("base", {}).get("ref") == "main"
          ]
          pattern = re.compile(
              r"(?:build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)"
              r"(?:\([^)]+\))?!?: .+"
          )
          if len(matches) != 1:
              raise SystemExit("release commit is not associated with exactly one merged PR")
          pull_request = matches[0]
          expected_subject = f"{pull_request.get('title')} (#{pull_request.get('number')})"
          if title != expected_subject or not pattern.fullmatch(title):
              raise SystemExit("release commit subject does not match its validated PR title")
          PY
          done

      - name: Calculate expected Conventional Commit tag
        if: ${{ steps.tags.outputs.releasable == 'true' }}
        id: expected
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ github.event.workflow_run.head_sha }}
          ref: main
          release_branches: main
          create_annotated_tag: true
          previous_tag: ${{ steps.tags.outputs.previous_tag }}
          previous_version: ${{ steps.tags.outputs.previous_version }}
          default_bump: false
          ignore_keywords: ""
          custom_release_rules: "build:patch:Build System,chore:patch:Maintenance,ci:patch:Continuous Integration,docs:patch:Documentation,feat:minor:Features,fix:patch:Bug Fixes,perf:patch:Performance,refactor:patch:Code Refactoring,revert:patch:Reverts,style:patch:Styles,test:patch:Tests"
          dry_run: true

      - name: Create expected Conventional Commit tag
        if: ${{ steps.tags.outputs.releasable == 'true' && steps.tags.outputs.existing_tag == '' }}
        id: tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ github.event.workflow_run.head_sha }}
          ref: main
          release_branches: main
          create_annotated_tag: true
          previous_tag: ${{ steps.tags.outputs.previous_tag }}
          previous_version: ${{ steps.tags.outputs.previous_version }}
          default_bump: false
          ignore_keywords: ""
          custom_release_rules: "build:patch:Build System,chore:patch:Maintenance,ci:patch:Continuous Integration,docs:patch:Documentation,feat:minor:Features,fix:patch:Bug Fixes,perf:patch:Performance,refactor:patch:Code Refactoring,revert:patch:Reverts,style:patch:Styles,test:patch:Tests"

      - name: Resolve release identity
        if: ${{ steps.tags.outputs.releasable == 'true' }}
        id: release
        env:
          CREATED_TAG: ${{ steps.tag.outputs.new_tag }}
          CREATED_VERSION: ${{ steps.tag.outputs.new_version }}
          EXISTING_TAG: ${{ steps.tags.outputs.existing_tag }}
          EXPECTED_TAG: ${{ steps.expected.outputs.new_tag }}
          EXPECTED_VERSION: ${{ steps.expected.outputs.new_version }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${EXISTING_TAG:-$CREATED_TAG}"
          version="${EXPECTED_VERSION}"
          test -n "$EXPECTED_TAG"
          test -n "$version"
          test "$EXPECTED_TAG" = "v$version"
          test "$tag" = "$EXPECTED_TAG"
          if test -n "$CREATED_VERSION"; then
            test "$CREATED_VERSION" = "$version"
          fi
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          tag_ref="refs/tags/$tag"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          test "$(git rev-parse "$tag_ref^{commit}")" = "$RELEASE_COMMIT"
          printf 'commit=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          {
            echo "## Release $tag"
            echo
            echo "Commit: \`$RELEASE_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    if: ${{ needs.tag.outputs.tag != '' }}
    name: Build release distributions
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_COMMIT: ${{ needs.tag.outputs.commit }}
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
      UV_PYTHON: "3.14"
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ needs.tag.outputs.tag }}

      - name: Validate tag identity
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          git show-ref --verify --quiet "$tag_ref"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          test "$(git rev-parse "$tag_ref^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock consistency
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --python 3.14

      - name: Build once from the release tag
        run: uv build --no-build-isolation --out-dir "$RUNNER_TEMP/dist"

      - name: Verify tag-derived filenames
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/dist/agy_acp-$RELEASE_VERSION-py3-none-any.whl"
          test -f "$RUNNER_TEMP/dist/agy_acp-$RELEASE_VERSION.tar.gz"

      - name: Check distribution metadata
        run: uv run --frozen twine check --strict "$RUNNER_TEMP"/dist/*

      - name: Verify distribution archives and installation
        run: uv run --frozen python scripts/package_smoke.py "$RUNNER_TEMP/dist"

      - name: Record immutable artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          {
            echo '## Release artifact SHA-256'
            echo '```text'
            sha256sum *.whl *.tar.gz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: |
            ${{ runner.temp }}/dist/*.whl
            ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  prepare-publish:
    name: Check PyPI publication state
    needs:
      - tag
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish-needed: ${{ steps.plan.outputs.publish-needed }}
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: validated-dist

      - name: Plan PyPI publication
        id: plan
        run: >-
          python -m scripts.prepare_pypi_publish
          --version "$RELEASE_VERSION"
          --dist-dir validated-dist
          --output-dir "$RUNNER_TEMP/pending-dist"

      - name: Upload verified missing distributions
        if: ${{ steps.plan.outputs.publish-needed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-pending-distributions
          path: ${{ runner.temp }}/pending-dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ needs.prepare-publish.outputs.publish-needed == 'true' }}
    name: Publish validated distributions
    needs:
      - tag
      - prepare-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agy-acp/${{ needs.tag.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download verified missing distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-pending-distributions
          path: dist

      - name: Publish verified missing distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          verify-metadata: true
          skip-existing: false
          verbose: false
          print-hash: true
          attestations: true
