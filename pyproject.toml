[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "agy-acp"
dynamic = ["version"]
description = "ACP v1 adapter for the Google Antigravity CLI"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["acp", "agent-client-protocol", "antigravity", "adapter"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "agent-client-protocol==0.12.1",
]

[project.urls]
Repository = "https://github.com/Kcrong/agy-acp"
Issues = "https://github.com/Kcrong/agy-acp/issues"
Security = "https://github.com/Kcrong/agy-acp/security/policy"

[project.scripts]
agy-acp = "agy_acp.cli:main"

[dependency-groups]
dev = [
  "hatchling==1.32.4",
  "hatch-vcs==0.5.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-timeout==2.4.0",
  "pyyaml==6.0.3",
  "types-pyyaml==6.0.12.20260906",
  "ruff==0.16.9",
]
tck = [
  "acp-tck @ git+https://github.com/agentclientprotocol/acp-tck.git@9b4334813bc4a3583285592027cc2f3ab85793bd ; python_version >= '3.14'",
]
release = [
  "twine==7.0.0",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?)$'

[tool.hatch.build.targets.wheel]
packages = ["src/agy_acp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/agy_acp",
  ".gitignore",
  "pyproject.toml",
  "uv.lock",
  "README.md",
  "LICENSE",
  "SECURITY.md",
  "CONTRIBUTING.md",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "--timeout=30", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
